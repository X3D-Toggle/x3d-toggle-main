# GPU / CPU IRQ Binding & Process Pinning Ruleset
# Format: [EXECUTABLE_NAME]=[AFFINITY_MASK]
# Mask is a hexadecimal value representing the logical core bitmask.
# 
# Examples:
#   Pin to CCD0 (Cores 0-7 on 16-thread): 0x00FF
#   Pin to CCD1 (Cores 8-15 on 16-thread): 0xFF00
#   Pin to specific Hyperthreads: 0x5555
# -----------------------------------------------------------------------------

# System Services (Example: Pin to Frequency CCD)
# discord=0xFF00
# steam=0xFF00

# High-Performance Overrides
# render_engine=0xFFFF

# -----------------------------------------------------------------------------

# IRQ Pinning / Mask
# 0: Core 0 (Default I/O Isolation)
# 1: Preferred: OS preferred core (Dynamic lscpu discovery)
# 2: Pinned: User designated core (IRQ_CUSTOM)
# 3: None: irqbalance (default)
IRQ_PINNING=0

# Define target for IRQ_PINNING=2
# Format: <core_number>
# Example: 2,4,5
# none clears the mask
IRQ_CUSTOM=none

# Thread Management
# 0: Unrestricted (Default - Let OS/Game Engine schedule)
# 1: Restricted (Apply THREAD_CAP to background/compute tasks only)
THREAD_CONTROL=0

# Max threads allowed for non-gaming workloads (LLMs/Encoding)
# This prevents background tasks from saturating the Frequency CCD
THREAD_CAP=16

# Thread Exemptions
# Enable to exempt the following tasks from thread control:
# - LLMs (Large Language Models)
# - Encoding (Video/Audio encoding)
# - Rendering (3D rendering, GPU-intensive tasks)
# Format: "<process1>,<process2>"
THREAD_EXEMPT="antigravity,ffmpeg,blender"

# [IRQ] Device Steering
# Master switch: 0 = disabled (irqbalance manages all), 1 = enabled
IRQ_ENABLE=1

# Per-device IRQ steering (only evaluated when IRQ_ENABLE=1)
# 1 = steer to IRQ_PINNING target core, 0 = leave to OS
IRQ_GPU=1
IRQ_NVME=1
IRQ_USB=1
IRQ_NIC=1
IRQ_AUDIO=1

# [IRQ] Advanced Features
# 1 = disable rx/tx coalescing delays on steered NICs
IRQ_COALESCE=0
# 1 = enable background watch mode to re-assert migrated IRQs
IRQ_WATCH=0

# end of AFFINITY.CONF

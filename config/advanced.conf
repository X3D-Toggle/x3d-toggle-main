# Advanced Kernel Toggles for the X3D Toggle Project
# `advanced.conf`
# This file allows advanced users to fine-tune kernel parameters for optimal
# performance and responsiveness.
# NOTE: Incorrect values can negatively impact system stability.
# NOTE: Parse current kernel settings via `sysctl --system` and parse 
# `/usr/lib/sysctl.d/*` and `/etc/sysctl.d/*` for current values to apply them to
# this config file. This file is a template for the kernel settings and is 
# intended to be applied directly to the system via `sysctl`
# or `sysfs`. It can be reapplied after a reboot to restore the same
# kernel settings.

# --- [SYSTEM PERFORMANCE & MEMORY & SCHEDULER] ---
# Frequency of task bandwidth quota checks (Lower = better interactivity)
# Default: 5000
kernel.sched_cfs_bandwidth_slice_us=3000

# Enable BORE (Burst-Oriented Response Enhancer)
# Default: 0 (Disabled)
kernel.sched_bore=1

# Adjust the sensitivity of burst identification (Default is usually 12)
# Higher values (up to 15) make the scheduler more aggressive at
# protecting interactive tasks from background "hogs."
# Default: 12
kernel.sched_bit_shift=12

# Prevent bursty tasks from being penalized for forking (Good for IDEs)
# Default: 0
kernel.sched_burst_fork_at_init=1

# --- [MEMORY MANAGEMENT] ---
# Increase the default vm.max_map_count value for high-performance apps/games memory map areas
# https://archlinux.org/news/increasing-the-default-vmmax_map_count-value/
# Default: 65530
vm.max_map_count=1048576

# --- [MISCELLANEOUS] ---
# Disables split lock detection 
# The Arch Wiki notes that split lock detection can cause significant stutters 
# in certain applications and games. Disabling this mitigation via your daemon 
# when in "Rabbit" mode ensures smoother frame times.
# Toggled via sysctl kernel.split_lock_mitigate
# Options: 0: off for Gaming (Default mode), 1: on for Balanced
split_lock_detect=0

# NMI Watchdog
# Disables the non-maskable interrupt watchdog.
# Benefit: Disabling this frees up one hardware performance counter and reduces 
# background interrupts. This is a standard low-latency optimization for 
# systems where every millisecond counts.
# Toggled via sysctl kernel.nmi_watchdog
# Default: 1
nmi_watchdog=0

# Transparent Hugepages (THP)
# Benefit: Many modern game engines benefit from always or madvise. Your GUI 
# could offer a "Gaming Memory" toggle that ensures THP is configured to 
# reduce TLB misses during heavy cache-sensitive workloads.
# Toggled via sysctl vm.transparent_hugepages (Target Path: /sys/kernel/mm/transparent_hugepage/enabled)
# Options: always, madvise(default), never
target_thp_mode=madvise

